{% extends "base.html" %}
{% block titre %}Modifier un utilisateur — Optic's Eden{% endblock %}
{% block contenu %}
<div class="card management-form">
    <p class="eyebrow">Gestion de l'équipe</p><h1>Modifier le profil</h1><p class="section-subtitle">{{ utilisateur.get_full_name|default:utilisateur.username }}</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><a class="btn btn-ghost" href="{% url 'gestion' %}">Annuler</a><button class="btn btn-primary btn-auto" type="submit">Enregistrer</button></div></form>
</div>
{% endblock %}
